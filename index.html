<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz primer mes</title>
  <style>
    :root{
      --bg1:#ffdfe8;
      --bg2:#fff1f8;
      --bg3:#fffdf8;
      --pink1:#ff7eb6;
      --pink2:#ff9ec7;
      --pink3:#ffd7ea;
      --skin:#f8d6c6;
      --hair:#352a31;
      --hair2:#4a3943;
      --dress1:#ff8eb6;
      --dress2:#ffc2d9;
      --leaf:#7ad59a;
      --leaf2:#4eb06e;
      --gold:#f7d970;
      --text:#fffafc;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    }

    body{
      display:grid;
      place-items:center;
    }

    .scene{
      position:relative;
      width:100%;
      height:100vh;
      min-height:680px;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,0.8), rgba(255,255,255,0) 18%),
        radial-gradient(circle at 15% 25%, rgba(255,255,255,0.3), transparent 15%),
        radial-gradient(circle at 83% 18%, rgba(255,255,255,0.28), transparent 14%);
    }

    .sun{
      position:absolute;
      right:12%;
      top:52px;
      width:150px;
      height:150px;
      border-radius:50%;
      background:radial-gradient(circle, #fff9cf 0%, #ffe8a0 18%, #ffc76e 42%, rgba(255,183,85,0.32) 72%, rgba(255,183,85,0) 100%);
      box-shadow:0 0 65px rgba(255,200,120,0.7);
      animation:floatSun 6s ease-in-out infinite;
    }

    @keyframes floatSun{
      0%,100{transform:translateY(0) scale(1)}
      50%{transform:translateY(-10px) scale(1.04)}
    }

    .cloud{
      position:absolute;
      background:rgba(255,255,255,0.7);
      border-radius:999px;
      filter:blur(1px);
      animation:drift 18s ease-in-out infinite;
      z-index:1;
    }

    .cloud::before, .cloud::after{
      content:"";
      position:absolute;
      border-radius:50%;
      background:rgba(255,255,255,0.75);
    }

    .cloud.one{
      left:8%;
      top:92px;
      width:160px;
      height:42px;
    }
    .cloud.one::before{
      width:58px;height:58px;left:18px;top:-24px;
    }
    .cloud.one::after{
      width:70px;height:70px;right:18px;top:-28px;
    }

    .cloud.two{
      right:12%;
      top:140px;
      width:170px;
      height:44px;
      animation-delay:-7s;
    }
    .cloud.two::before{
      width:60px;height:60px;left:16px;top:-22px;
    }
    .cloud.two::after{
      width:72px;height:72px;right:20px;top:-30px;
    }

    @keyframes drift{
      0%,100{transform:translateX(0)}
      50%{transform:translateX(26px)}
    }

    .message{
      position:absolute;
      left:50%;
      top:42px;
      transform:translateX(-50%);
      font-size:clamp(20px, 3vw, 42px);
      letter-spacing:2px;
      font-weight:700;
      color:var(--text);
      text-shadow:0 6px 18px rgba(255,132,190,0.8);
      z-index:20;
      text-align:center;
      width:90%;
    }

    .ground{
      position:absolute;
      left:-8%;
      right:-8%;
      bottom:-22px;
      height:205px;
      background:linear-gradient(to top, #58b76b 0%, #7bd285 38%, #b4f1a5 100%);
      border-radius:50% 50% 0 0 / 100% 100% 0 0;
      box-shadow:inset 0 12px 0 rgba(255,255,255,0.2);
      z-index:0;
    }

    .character{
      position:absolute;
      left:50%;
      bottom:110px;
      width:290px;
      height:440px;
      transform:translateX(-50%);
      z-index:8;
      animation:bob 3.8s ease-in-out infinite;
    }

    @keyframes bob{
      0%,100{transform:translateX(-50%) translateY(0)}
      50%{transform:translateX(-50%) translateY(-12px)}
    }

    .shadow{
      position:absolute;
      left:50%;
      bottom:55px;
      width:220px;
      height:34px;
      transform:translateX(-50%);
      background:rgba(137,74,118,0.25);
      border-radius:50%;
      filter:blur(6px);
      z-index:1;
    }

    .hair-back{
      position:absolute;
      left:50%;
      top:12px;
      width:154px;
      height:172px;
      transform:translateX(-50%);
      background:linear-gradient(180deg, #463741 0%, var(--hair) 100%);
      border-radius:52% 48% 50% 50% / 52% 52% 48% 48%;
      z-index:1;
      box-shadow:
        -28px 20px 0 -10px rgba(74,57,67,0.95),
        28px 20px 0 -10px rgba(74,57,67,0.95);
    }

    .bang{
      position:absolute;
      left:50%;
      top:8px;
      width:118px;
      height:90px;
      transform:translateX(-50%);
      background:linear-gradient(180deg, #473942 0%, var(--hair) 100%);
      border-radius:58% 42% 58% 42%;
      z-index:8;
    }

    .bang::before,.bang::after{
      content:"";
      position:absolute;
      width:52px;
      height:72px;
      top:18px;
      background:linear-gradient(180deg, #473942 0%, var(--hair) 100%);
      border-radius:50%;
    }
    .bang::before{left:-6px;transform:rotate(-28deg)}
    .bang::after{right:-6px;transform:rotate(28deg)}

    .head{
      position:absolute;
      left:50%;
      top:42px;
      width:128px;
      height:140px;
      transform:translateX(-50%);
      background:var(--skin);
      border-radius:46% 46% 49% 49% / 52% 52% 48% 48%;
      z-index:6;
      box-shadow:inset -10px -10px 0 rgba(0,0,0,0.03);
    }

    .eye{
      position:absolute;
      width:17px;
      height:19px;
      top:100px;
      background:#1d1a1d;
      border-radius:50%;
      z-index:9;
      animation:blink 5s infinite;
    }
    .eye.left{left:102px}
    .eye.right{right:102px}
    @keyframes blink{
      0%,44%,46%,100{transform:scaleY(1)}
      45%{transform:scaleY(0.12)}
    }

    .eye::after{
      content:"";
      position:absolute;
      width:6px;height:6px;
      top:3px;right:2px;
      border-radius:50%;
      background:rgba(255,255,255,0.7);
    }

    .blush{
      position:absolute;
      width:18px;height:10px;
      top:122px;
      background:rgba(255, 144, 186, 0.55);
      border-radius:50%;
      z-index:8;
    }
    .blush.left{left:82px}
    .blush.right{right:82px}

    .smile{
      position:absolute;
      left:50%;
      top:126px;
      width:32px;height:18px;
      transform:translateX(-50%);
      border-bottom:4px solid #d7788d;
      border-radius:0 0 20px 20px;
      z-index:8;
    }

    .neck{
      position:absolute;
      left:50%;
      top:168px;
      width:30px;height:28px;
      transform:translateX(-50%);
      background:var(--skin);
      border-radius:10px;
      z-index:5;
    }

    .body{
      position:absolute;
      left:50%;
      top:180px;
      width:180px;height:170px;
      transform:translateX(-50%);
      background:linear-gradient(180deg, var(--dress2) 0%, var(--dress1) 100%);
      border-radius:35% 35% 25% 25% / 28% 28% 25% 25%;
      box-shadow:inset 0 -12px 0 rgba(255,255,255,0.17);
      z-index:3;
    }

    .body::before,.body::after{
      content:"";
      position:absolute;
      top:22px;
      width:42px;height:88px;
      background:rgba(255,255,255,0.12);
      border-radius:16px;
    }
    .body::before{left:28px;transform:rotate(10deg)}
    .body::after{right:28px;transform:rotate(-10deg)}

    .left-arm,.right-arm{
      position:absolute;
      top:188px;
      width:34px;height:120px;
      background:linear-gradient(180deg, var(--skin), #f0c7b3);
      border-radius:26px;
      z-index:2;
    }
    .left-arm{left:60px;transform:rotate(20deg)}
    .right-arm{right:60px;transform:rotate(-20deg)}

    .left-arm::after,.right-arm::after{
      content:"";
      position:absolute;
      width:32px;height:24px;
      left:1px;bottom:-8px;
      border-radius:50%;
      background:var(--skin);
    }

    .left-leg,.right-leg{
      position:absolute;
      bottom:42px;
      width:42px;height:100px;
      background:linear-gradient(180deg, #f2d3c0 0%, #d5a185 100%);
      border-radius:18px;
      z-index:1;
    }
    .left-leg{left:110px}
    .right-leg{right:110px}

    .left-shoe,.right-shoe{
      position:absolute;
      bottom:18px;
      width:66px;height:22px;
      background:#f4d49a;
      border-radius:20px 20px 12px 12px;
      z-index:0;
    }
    .left-shoe{left:94px}
    .right-shoe{right:94px}

    .flower{
      position:absolute;
      bottom:76px;
      width:90px;height:110px;
      z-index:9;
      animation:swayFlower 5s ease-in-out infinite;
    }
    .flower.left{left:9%}
    .flower.right{right:9%;animation-delay:.9s}

    @keyframes swayFlower{
      0%,100{transform:rotate(-3deg) translateY(0)}
      50%{transform:rotate(4deg) translateY(-12px)}
    }

    .flower .stem{
      position:absolute;
      left:50%;bottom:0;
      width:6px;height:70px;
      transform:translateX(-50%);
      background:linear-gradient(180deg, #6ddc93 0%, var(--leaf2) 100%);
      border-radius:10px;
    }

    .flower .leaf{
      position:absolute;
      width:22px;height:28px;
      bottom:36px;
      background:linear-gradient(180deg,#9bf0bb,#59c480);
      border-radius:80% 0 80% 0;
    }
    .flower .leaf.left{left:18px;transform:rotate(-25deg)}
    .flower .leaf.right{right:18px;transform:scaleX(-1) rotate(-25deg)}

    .flower .bloom{
      position:absolute;
      left:50%;top:10px;
      width:52px;height:52px;
      transform:translateX(-50%);
      border-radius:50%;
      background:radial-gradient(circle at 30% 30%, #fff 0%, #ffe6f2 18%, var(--pink2) 38%, var(--pink1) 80%, #ed8fc2 100%);
      box-shadow:0 0 18px rgba(255,160,208,0.7);
    }
    .flower .bloom::before, .flower .bloom::after{
      content:"";
      position:absolute;
      width:40px;height:40px;
      left:6px;top:6px;
      border-radius:50%;
      background:radial-gradient(circle at 30% 30%, #fff, rgba(255,216,234,0.9) 32%, rgba(255,163,214,0.95) 100%);
    }
    .flower .bloom::before{transform:rotate(45deg)}
    .flower .bloom::after{transform:rotate(-45deg)}

    .flower .center{
      position:absolute;
      left:50%;top:28px;
      width:16px;height:16px;
      transform:translateX(-50%);
      border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 12px rgba(249,221,117,0.72);
      z-index:2;
    }

    .petals{
      position:absolute;
      inset:0;
      overflow:hidden;
      pointer-events:none;
      z-index:2;
    }

    .petal-float{
      position:absolute;
      width:18px;height:28px;
      background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,174,217,0.95));
      border-radius:70% 0 70% 0;
      opacity:0.8;
      animation:fall linear infinite;
      box-shadow:inset 0 0 8px rgba(255,255,255,0.35);
    }
    .petal-float:nth-child(2n){
      background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(255,199,120,0.92));
    }
    .petal-float:nth-child(3n){
      background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(255,147,202,0.9));
    }

    @keyframes fall{
      0%{
        transform:translate3d(0,-10vh,0) rotate(0deg);
        opacity:0;
      }
      20%{opacity:0.9}
      100%{
        transform:translate3d(var(--drift),110vh,0) rotate(360deg);
        opacity:0;
      }
    }

    @media (max-width: 620px){
      .scene{
        min-height:620px;
      }

      .sun{
        width:110px;
        height:110px;
        right:8%;
        top:32px;
      }

      .cloud.one{left:2%;top:72px;transform:scale(0.8)}
      .cloud.two{right:2%;top:110px;transform:scale(0.8)}

      .message{
        top:24px;
        letter-spacing:1px;
        font-size:clamp(24px, 7vw, 38px);
      }

      .character{
        transform:translateX(-50%) scale(0.82);
        bottom:70px;
      }

      .flower.left{left:5%;transform:scale(0.8)}
      .flower.right{right:5%;transform:scale(0.8)}

      .ground{
        height:180px;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="message">Feliz primer mes</div>

    <div class="sun"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <div class="petals">
      <div class="petal-float" style="left: 8%; top:-8%; --drift: 46px; animation-duration: 14s;"></div>
      <div class="petal-float" style="left: 18%; top:-10%; --drift:-34px; animation-duration:16s; animation-delay:0.8s;"></div>
      <div class="petal-float" style="left: 30%; top:-12%; --drift: 32px; animation-duration:18s; animation-delay:1.2s;"></div>
      <div class="petal-float" style="left: 45%; top:-8%; --drift:-38px; animation-duration:15s; animation-delay:0.5s;"></div>
      <div class="petal-float" style="left: 57%; top:-11%; --drift:44px; animation-duration:17s; animation-delay:1.9s;"></div>
      <div class="petal-float" style="left: 70%; top:-9%; --drift:-30px; animation-duration:14.5s; animation-delay:1.1s;"></div>
      <div class="petal-float" style="left: 85%; top:-10%; --drift:46px; animation-duration:15.5s; animation-delay:0.7s;"></div>
      <div class="petal-float" style="left: 94%; top:-9%; --drift:-24px; animation-duration:16.5s; animation-delay:2.3s;"></div>
      <div class="petal-float" style="left: 52%; top:-6%; --drift:50px; animation-duration:13s; animation-delay:0.4s;"></div>
      <div class="petal-float" style="left: 24%; top:-7%; --drift:-42px; animation-duration:17s; animation-delay:2.5s;"></div>
    </div>

    <div class="flower left">
      <div class="stem"></div>
      <div class="leaf left"></div>
      <div class="leaf right"></div>
      <div class="bloom"></div>
      <div class="center"></div>
    </div>

    <div class="flower right">
      <div class="stem"></div>
      <div class="leaf left"></div>
      <div class="leaf right"></div>
      <div class="bloom"></div>
      <div class="center"></div>
    </div>

    <div class="character">
      <div class="shadow"></div>
      <div class="hair-back"></div>
      <div class="bang"></div>

      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="blush left"></div>
        <div class="blush right"></div>
        <div class="smile"></div>
      </div>

      <div class="neck"></div>
      <div class="body"></div>
      <div class="left-arm"></div>
      <div class="right-arm"></div>
      <div class="left-leg"></div>
      <div class="right-leg"></div>
      <div class="left-shoe"></div>
      <div class="right-shoe"></div>
    </div>

    <div class="ground"></div>
  </div>
</body>
  </html>
